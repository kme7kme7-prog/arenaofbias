<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>账号弹窗换纸动画对照</title>
<style>
  body { margin: 0; background: #dfe3dd; color: #20221d; font: 14px system-ui; }
  header { padding: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button { padding: 8px 14px; background: #eef0e9; border: 1px solid #879780; cursor: pointer; font: inherit; }
  p { margin: 0 16px 16px; max-width: 100ch; line-height: 1.8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 28px; padding: 8px 16px 32px; }
  .cell h3 { margin: 0 0 10px; font-size: 13px; letter-spacing: 0.08em; }
  /* 复刻账号弹窗的纸张观感（只取骨架，非全量样式） */
  .sheet {
    position: relative; background: #f4f2e4; border: 1px solid #aab298;
    box-shadow: 0 2px 3px #18211815, 0 24px 70px #101c2345;
    padding: 20px 26px 16px 34px; overflow: hidden; min-height: 320px;
  }
  .meta { display: flex; justify-content: space-between; font-size: 10px; color: #798169; border-bottom: 1px solid #a3ad8c80; padding-bottom: 10px; margin-bottom: 14px; }
  .title { font-size: 22px; font-weight: 800; margin: 0 0 8px; color: #25302b; }
  .desc { font-size: 11px; color: #798169; margin: 0 0 14px; }
  .field { height: 40px; border: 1px solid #a3ad8c80; border-bottom: 2px solid #8e997a; background: #ffffff57; margin-bottom: 12px; }
  .field.half { width: 60%; }
  .go { display: block; width: 100%; padding: 13px; background: #25302b; color: #d9fb51; border: 0; font-weight: 700; text-align: left; }
  /* 候选动画：全部是入场式（React 换 key 重挂的真实条件，做不了旧页离场） */
  @keyframes turn-slide {
    0% { opacity: 0; transform: translateX(42px); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes turn-rise {
    0% { opacity: 0; transform: translateY(30px); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes turn-ink {
    0% { opacity: 0; filter: blur(9px); transform: scale(0.985); }
    100% { opacity: 1; filter: blur(0); transform: none; }
  }
  @keyframes turn-slap {
    /* 2026-09-25 用户反馈「提醒字是歪的」：现行实现去掉起始 rotate(1.8deg)，
       只保留拍落位移+缩放；此对照页保留原 D 姿态供回看对比 */
    0% { opacity: 0; transform: translateY(-32px) scale(1.03); }
    100% { opacity: 1; transform: none; }
  }
  .turn-slide { animation: turn-slide 0.42s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .turn-rise { animation: turn-rise 0.5s cubic-bezier(0.18, 1.25, 0.4, 1) both; }
  .turn-ink { animation: turn-ink 0.55s cubic-bezier(0.22, 0.8, 0.35, 1) both; }
  .turn-slap { animation: turn-slap 0.5s cubic-bezier(0.2, 1.35, 0.3, 1) both; }
</style>
<header><b>账号弹窗 / 换纸动画对照（点各格的「切换页面」反复比较）</b></header>
<p>上一版绕左轴的 3D 翻页中途纸面掀空、观感碎。以下四个候选全部只做入场（真实实现里 React 换 key 重挂，做不了旧页离场动画，对照页同条件）：A 侧滑抽纸（新纸从右侧抽出）、B 上浮落定（从纸堆下方浮起，带一点回弹）、C 墨水落定（模糊转清晰，像墨迹定住）、D 卡片拍落（从上方拍在桌面上，带轻微歪斜回正）。选定后改 <code>app/account.css</code> 的 <code>account-page-turn</code> 即可。</p>
<div class="grid" id="grid"></div>
<script>
const LOGIN_HTML = `<div class="meta"><span>偏见试验场 / 评审手记</span><span>NO.01</span></div>
  <p class="title">欢迎回到评审席。</p>
  <p class="desc">登录后，用你的账号参与作品讨论。</p>
  <div class="field"></div><div class="field half"></div>
  <button class="go" type="button">登录，回到现场 ↗</button>`;
const REGISTER_HTML = `<div class="meta"><span>偏见试验场 / 评审手记</span><span>NO.02</span></div>
  <p class="title">给你的直觉，一个席位。</p>
  <p class="desc">注册需要一个常用邮箱：先收个验证码。</p>
  <div class="field"></div><div class="field"></div>
  <button class="go" type="button">验证邮箱，继续 ↗</button>`;
const candidates = [
  ['turn-slide', 'A / 侧滑抽纸'],
  ['turn-rise', 'B / 上浮落定'],
  ['turn-ink', 'C / 墨水落定'],
  ['turn-slap', 'D / 卡片拍落'],
];
for (const [cls, label] of candidates) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.innerHTML = `<h3>${label}</h3>
    <div class="sheet"><div class="page ${cls}"></div></div>
    <p style="margin:10px 0 0"><button type="button">切换页面</button></p>`;
  let showingLogin = true;
  cell.querySelector('.page').innerHTML = LOGIN_HTML;
  cell.querySelector('button:not(.go)').onclick = () => {
    // 换节点重放动画：与真实实现（React 换 key 重挂）同条件
    const old = cell.querySelector('.page');
    const fresh = old.cloneNode(false);
    fresh.innerHTML = showingLogin ? REGISTER_HTML : LOGIN_HTML;
    old.replaceWith(fresh);
    showingLogin = !showingLogin;
  };
  document.getElementById('grid').appendChild(cell);
}
</script>
</html>
