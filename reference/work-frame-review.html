<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>作品取景 · 多比例对照</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #20271f; color: #eef1e7; font: 14px system-ui; }
  header { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 14px 20px 10px; }
  h1 { font-size: 15px; margin: 0 auto 0 0; }
  select, button { color: inherit; background: transparent; border: 1px solid #798571; padding: 7px 11px; cursor: pointer; font: inherit; }
  button[aria-pressed='true'] { background: #eef1e7; color: #20271f; }
  p { margin: 0; padding: 0 20px 12px; color: #bac4b2; line-height: 1.6; font-size: 13px; }
  main { display: flex; flex-wrap: wrap; gap: 16px; padding: 0 20px 28px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font: 12px ui-monospace, monospace; color: #bac4b2; padding-bottom: 6px; }
  iframe { border: 1px solid #46523f; background: #dfe3dd; display: block; }
</style>
<header>
  <h1>作品取景 · 多比例对照</h1>
  <select id=work><option value="001-deepseek-v4-pro-0813-high">deepseek-v4-pro-0813-high</option><option value="001-deepseek-v4.1-flash-expires-on-0910">deepseek-v4.1-flash-expires-on-0910</option><option value="001-deepseek-v4.1-flash-wb-high">deepseek-v4.1-flash-wb-high</option><option value="001-gemini-3.5-flash-lite">gemini-3.5-flash-lite</option><option value="001-gemini-3.8-flash-high">gemini-3.8-flash-high</option><option value="001-glm-5.3">glm-5.3</option><option value="001-gpt-6-astra">gpt-6-astra</option><option value="001-gpt-6-astra-1hhmw">gpt-6-astra-1hhmw</option><option value="001-gpt-6-astra-low">gpt-6-astra-low</option><option value="001-gpt-6-astra-low-0nd6u">gpt-6-astra-low-0nd6u</option><option value="001-gpt-6-astra-low-2">gpt-6-astra-low-2</option><option value="001-gpt-6-astra-medium">gpt-6-astra-medium</option><option value="001-gpt-6-astra-medium-2">gpt-6-astra-medium-2</option><option value="001-lfm2.5-2.6b">lfm2.5-2.6b</option><option value="001-mimo-x-flash-preview">mimo-x-flash-preview</option><option value="001-qwen3.5-4b-thinking">qwen3.5-4b-thinking</option><option value="001-qwen3.8-27b-gsq-rco-iq3-s-xhigh">qwen3.8-27b-gsq-rco-iq3-s-xhigh</option><option value="001-seed-2.1-pro">seed-2.1-pro</option><option value="001-seed-2.1-pro-2">seed-2.1-pro-2</option><option value="001-seed-2.1-pro-high">seed-2.1-pro-high</option></select>
  <span id=ratios></span>
</header>
<p>同一份作品在四种容器比例下的预览微缩（都是真实 ?aob=prev 预览渲染）。检查：主体是否完整、有没有被裁。</p>
<main></main>
<script>
  const RATIOS = [1.35, 1.55, 1.8, 2.2];
  const H = 300;
  const main = document.querySelector('main');
  const sel = document.querySelector('#work');
  function render() {
    const work = sel.value;
    main.innerHTML = '';
    for (const r of RATIOS) {
      const fig = document.createElement('figure');
      fig.innerHTML = '<figcaption>容器比例 ' + r.toFixed(2) + ':1 （' + Math.round(H * r) + '×' + H + '）</figcaption>';
      const f = document.createElement('iframe');
      f.width = Math.round(H * r); f.height = H;
      f.src = '/works/001/' + work + '.html?aob=prev';
      fig.appendChild(f);
      main.appendChild(fig);
    }
  }
  sel.onchange = render;
  render();
</script>
</html>
