# systemd drop-in for aob-tank-coordinator.service; the calibration directory stays archived.
[Service]
StateDirectory=
StateDirectory=aob-tank-public-s01
Environment=TANK_COORDINATOR_DATA=/var/lib/aob-tank-public-s01
Environment=TANK_PUBLIC_ORIGIN=https://game.arenaofbias.icu
Environment=TANK_AUTO_MATCHES=1
LoadCredential=web-secret:/etc/aob-tank-coordinator/web-secret
LimitFSIZE=6442450944
