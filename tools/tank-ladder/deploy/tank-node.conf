# Legacy i5 runner uses origin-relative /claim and /complete.
# Keep this include confined to game.arenaofbias.icu; no public ladder API.
location = /claim {
    limit_except POST { deny all; }
    client_max_body_size 4k;
    client_body_timeout 15s;
    limit_conn perip 4;
    limit_conn perserver 8;
    proxy_pass http://127.0.0.1:5474/claim;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
}
location = /complete {
    limit_except POST { deny all; }
    client_max_body_size 32m;
    client_body_buffer_size 16k;
    client_body_timeout 15s;
    limit_conn perip 4;
    limit_conn perserver 8;
    proxy_pass http://127.0.0.1:5474/complete;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
}
location = /tank-node/status {
    limit_except GET { deny all; }
    client_max_body_size 1k;
    limit_conn perip 4;
    limit_conn perserver 8;
    proxy_pass http://127.0.0.1:5474/status;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}
