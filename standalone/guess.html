<!doctype html>
<!--
  模一把 · 独立单文件版（2026-09-23 自主站剥离）
  ────────────────────────────────────────────────────────────
  一个 HTML = 整个游戏：数据集、判定核心、界面全部内嵌，离线可用，
  双击打开即玩（file:// 亦可），不依赖任何服务端与网络。

  来源（与主站同口径移植，改动需两边同步）：
    - 判定核心  ← lib/guess-logic.ts（__CORE__ 标记内是逐行移植副本）
    - 数据集    ← lib/guess-models.json（__DATA__ 标记内，168 槽 / 204 可猜名）
    - 界面样式  ← app/guess.css 全文 + app/home.css 字标节选
    - 页面结构  ← app/guess.tsx（React 版改写为原生 DOM）

  与主站的差异（有意为之）：
    - 无服务端：判定本地跑；「防查看源码」在单文件里无意义，答案可从
      文件里推出来——独立版不设防，随便玩
    - 无分享卡（用户拍板不要）、无登录、无中英切换（仅中文）
    - 无路由与入场/翻页过场；棋盘逐格揭示等 CSS 动效保留
    - localStorage 键加 standalone- 前缀，不与同域主站的战绩互相污染
    - 每日答案与主站同算法（epoch 2026-09-13 散列派生）：只要主站没走
      后台增量通道加过模型，同一天两边出同一道题

  维护：数据集更新后，重跑一次 JSON 内嵌（把 lib/guess-models.json 的
  内容替换进 __DATA__ 段）；判定口径以 lib/guess-logic.ts 为准，
  npm run check:standalone 可机器对拍防漂移。
-->

}
.guess-suggest-heading > span:last-child {
  display: flex;
  gap: 5px;
  align-items: center;
}
.guess-suggest ul {
  list-style: none;
  margin: 0;
  padding: 5px;
  max-height: 312px;
  overflow: auto;
}
.guess-suggest li button {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 12px;
  text-align: left;
  padding: 10px 12px;
  border: 0;
  background: transparent;
  color: inherit;
}
.guess-suggest li.is-active {
  background: #dce6c9;
}
.guess-model-mark {
  width: 32px;
  height: 32px;
  border: 1px solid #adba98;
  display: grid;
  place-items: center;
  font-family: var(--mono);
  flex-shrink: 0;
}
.guess-suggest b {
  font-size: 13px;
  display: block;
}
.guess-suggest small {
  display: block;
  font-size: 10px;
  color: #6a775d;
  margin-top: 3px;
}
.guess-suggest time {
  margin-left: auto;
  font: 10px var(--mono);
  color: #6a775d;
}
.guess-no-match {
  font-size: 13px;
  padding: 20px;
}
.guess-board-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 22px 0 10px;
}
.guess-board-heading h2 {
  font-size: 12px;
  margin: 0;
  font-weight: 600;
}
.guess-legend {
  display: flex;
  gap: 13px;
  font-size: 10px;
  color: #b1bfaa;
}
.guess-legend span {
  display: flex;
  gap: 5px;
  align-items: center;
}
.guess-legend i {
  width: 7px;
  height: 7px;
  display: block;
}
.guess-legend .hit {
  background: var(--guess-hit);
}
.guess-legend .near {
  background: var(--guess-near);
}
.guess-legend .miss {
  background: #73816d;
}
.guess-board-scroll {
  overflow-x: auto;
  scrollbar-width: thin;
  scrollbar-color: #73816d #17271e;
  padding-bottom: 3px;
}
.guess-board {
  width: 100%;
  min-width: 810px;
  border-collapse: separate;
  border-spacing: 5px 6px;
  table-layout: fixed;
}
.guess-row-head th {
  font-size: 10px;
  font-weight: 400;
  color: #9cad92;
  padding: 8px 3px;
  text-align: center;
}
.guess-board .gcell-name {
  width: 204px;
  text-align: left;
}
.guess-row .gcell-name {
  padding: 10px 8px 10px 0;
  font-size: 12px;
}
.guess-row .gcell-name > span {
  display: inline-block;
  vertical-align: middle;
}
.guess-row .gcell-name b {
  display: block;
  max-width: 160px;
  font-size: 11px;
  line-height: 1.4;
  font-weight: 600;
  overflow-wrap: anywhere;
}
.guess-row .gcell-name small {
  display: block;
  color: #8fa185;
  font-size: 9px;
  font-weight: 400;
  margin-top: 4px;
}
.guess-row-number {
  font: 10px var(--mono);
  color: #718568;
  margin-right: 10px;
}
.gcell {
  position: relative;
  text-align: center;
  height: 66px;
  padding: 10px 4px;
  font-size: 10px;
  border-radius: 3px;
  overflow: hidden;
}
.gcell-value {
  display: block;
  font-weight: 650;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.gcell-indicator {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 5px auto 0;
  height: 12px;
  opacity: 0.65;
}
.gcell.hit {
  background: var(--guess-hit);
  color: #183b23;
}
.gcell.near {
  background: var(--guess-near);
  color: #473918;
}
.gcell.miss {
  background: var(--guess-miss);
  color: #cad4bf;
}
.gcell.unknown {
  background: #223327;
  color: #a1b297;
  border: 1px dashed #506347;
}
.guess-row.is-new .gcell {
  animation: guess-tile 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  animation-delay: calc(var(--cell-order)*90ms);
}
.guess-row.is-new .gcell:after {
  content: '';
  position: absolute;
  inset: 0;
  background: #243729;
  transform-origin: bottom;
  animation: guess-uncover 0.4s both;
  animation-delay: calc(var(--cell-order)*90ms + 100ms);
}
.guess-row.is-new .gcell-name {
  animation: guess-enter 0.4s both;
}
.guess-ghost td {
  height: 56px;
  color: #819174;
  font-size: 11px;
}
.guess-ghost td:not(.gcell-name) {
  border: 1px dashed #3f5137;
  text-align: center;
  border-radius: 3px;
  color: #657c59;
}
.guess-empty {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px 8px;
  color: #a8ba9b;
}
.guess-empty strong {
  font-size: 12px;
  color: #d1dcc5;
  font-weight: 500;
}
.guess-empty p {
  font-size: 10px;
  margin: 6px 0 0;
  line-height: 1.6;
}
.guess-empty-tiles {
  display: flex;
  gap: 5px;
  margin-left: auto;
  transform: rotate(-8deg);
}
.guess-empty-tiles i {
  display: block;
  width: 20px;
  height: 27px;
  border: 1px solid #6b7f53;
  background: #243622;
}
.guess-empty-tiles i:nth-child(2) {
  background: #5b7040;
  transform: translateY(-5px);
}
.guess-empty-tiles i:nth-child(3) {
  background: var(--guess-accent);
}
.guess-board-foot {
  border-top: 1px solid #33472f;
  display: flex;
  justify-content: space-between;
  color: #8ea080;
  font-size: 9px;
  padding-top: 13px;
  margin-top: 10px;
  gap: 14px;
}
.guess-result {
  padding: 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  background: #253c24;
  border: 1px solid #718b43;
  position: relative;
  overflow: hidden;
}
.guess-result.is-loss {
  background: #26352d;
  border-color: #4e6254;
}
.guess-result.is-fresh {
  animation: guess-enter 0.6s 0.95s both;
}
.guess-result-symbol {
  color: var(--guess-accent);
}
.guess-result-copy > span {
  font-size: 10px;
  color: #c3d5a6;
}
.guess-result h2 {
  font-size: 26px;
  letter-spacing: -0.04em;
  margin: 6px 0;
  line-height: 1.2;
}
.guess-result p {
  font-size: 10px;
  color: #b2c49d;
  margin: 0;
}
.guess-result-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}
.guess-share {
  white-space: nowrap;
}
/* 重玩：次级幽灵按钮，酸黄描边与分享主按钮拉开层级；悬停图标倒转半圈呼应「重开」 */
.guess-replay {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 16px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  color: var(--guess-accent);
  background: transparent;
  border: 1px solid #718b43;
  transition:
    border-color 0.18s,
    background 0.18s,
    transform 0.18s;
}
.guess-replay:hover {
  border-color: var(--guess-accent);
  background: #d8f36a14;
  transform: translateY(-2px);
}
.guess-replay svg {
  transition: transform 0.35s;
}
.guess-replay:hover svg {
  transform: rotate(-180deg);
}
.guess-reveal {
  background: transparent;
  border: 0;
  color: #d8f36a;
}
/* 对局进行中的「直接看答案」入口（2026-09-15 从结果面板移到搜索区，
   原位置的显示条件永远不成立，按钮一直点不到） */
.guess-search-section .guess-reveal {
  display: block;
  margin: -14px 0 18px;
  padding: 0;
  font-size: 11px;
  letter-spacing: 0.08em;
  opacity: 0.75;
  cursor: pointer;
}
.guess-search-section .guess-reveal:hover:not(:disabled) {
  opacity: 1;
}
.guess-search-section .guess-reveal:disabled {
  opacity: 0.4;
  cursor: wait;
}

/* 模式选择：每日挑战为主，三档练习为次。 */
.guess-difficulty {
  animation: guess-enter 0.5s both;
  padding: 28px 0 40px;
}
.guess-main:focus {
  outline: none;
}
.guess-picker-back {
  margin-bottom: 14px;
}
.guess-page a[aria-disabled='true'] {
  opacity: 0.5;
  cursor: wait;
}
.guess-difficulty-head {
  position: relative;
  padding: 0 0 28px;
}
.guess-difficulty-head .guess-edition {
  margin-top: 14px;
}
.guess-difficulty-head h1 {
  font-size: clamp(48px, 5.4vw, 76px);
  letter-spacing: -0.055em;
  line-height: 1.15;
  margin: 18px 0 14px;
  font-weight: 650;
}
.guess-difficulty-head h1 > span {
  color: #c4d394;
  font-weight: 400;
  font-size: 0.65em;
  display: inline-block;
  margin-left: 25px;
  vertical-align: top;
}
.guess-difficulty-head p {
  color: #a1b09a;
  font-size: 12px;
  line-height: 1.9;
  margin: 0;
  max-width: 560px;
}
.guess-difficulty-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.guess-difficulty-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 16px;
  text-align: left;
  padding: 25px 24px 20px;
  background: #19291f;
  border: 1px solid #3a4b35;
  color: inherit;
  cursor: pointer;
  min-height: 250px;
  isolation: isolate;
  transition:
    border-color 0.2s,
    transform 0.2s,
    background 0.2s;
}
.guess-difficulty-card:hover:not(:disabled) {
  border-color: #a3b982;
  background: #213323;
  transform: translateY(-3px);
}
.guess-difficulty-card:focus-visible {
  outline: 2px solid var(--guess-accent);
  outline-offset: 4px;
}
.guess-difficulty-card[data-level]:before {
  content: '0' attr(data-level);
  position: absolute;
  right: 24px;
  top: 17px;
  font: 70px var(--mono);
  color: #a5bb8112;
  letter-spacing: -0.08em;
  z-index: -1;
}
.guess-difficulty-icon {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-bottom: 1px solid #a8bd7d5e;
  color: #b9cf92;
}
.guess-difficulty-name {
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.guess-difficulty-name b {
  font-size: 25px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.guess-difficulty-name small {
  font: 9px var(--mono);
  letter-spacing: 0.12em;
  color: #91a27e;
}
.guess-difficulty-blurb {
  font-size: 11px;
  line-height: 1.8;
  color: #a6b69a;
}
.guess-difficulty-meta {
  margin-top: auto;
  width: 100%;
  padding-top: 18px;
  border-top: 1px solid #83976b30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 10px;
  color: #a0b28f;
}
.guess-difficulty-status {
  font-size: 9px;
  padding: 4px 7px;
  background: #263922;
  color: #b2c49b;
  white-space: nowrap;
}
.guess-difficulty-status.is-playing {
  color: #d8f36a;
  background: #3b4e24;
}
.guess-difficulty-status.is-done {
  color: #d5e7bb;
  background: #385034;
}
.guess-difficulty-go {
  position: absolute;
  top: 25px;
  right: 23px;
  color: #a2b78c;
  transition: transform 0.2s;
}
.guess-difficulty-card:hover .guess-difficulty-go {
  transform: translate(2px, -2px);
  color: #d8f36a;
}
.guess-difficulty-card.guess-daily-card {
  width: 100%;
  min-height: 255px;
  padding: 30px 34px;
  background: #223622;
  border-color: #64764b;
  box-shadow: inset 3px 0 #c5d89b;
  overflow: hidden;
}
.guess-daily-card .guess-difficulty-icon {
  border: 0;
  color: #d9e8b7;
}
.guess-daily-card .guess-difficulty-name b {
  font-size: 32px;
}
.guess-daily-card .guess-difficulty-name small {
  color: #c3d5a5;
}
.guess-daily-card .guess-difficulty-blurb,
.guess-daily-card .guess-difficulty-meta {
  width: 62%;
}
.guess-daily-art {
  position: absolute;
  right: 12%;
  top: 30px;
  width: 124px;
  height: 170px;
  transform: rotate(8deg);
  pointer-events: none;
  opacity: 0.85;
}
.guess-daily-art > span {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: grid;
  place-items: center;
  border: 1px solid #b7c8968a;
  background: #34472c;
  box-shadow:
    inset 0 0 0 5px #24371f,
    inset 0 0 0 6px #b7c89635,
    0 12px 24px #0003;
  color: #dbe5c3;
  font:
    italic 92px Georgia,
    serif;
  border-radius: 3px;
}
.guess-daily-art i {
  position: absolute;
  inset: 0;
  border: 1px solid #b7c8963a;
  background: #2b3e23;
  transform: rotate(-10deg) translate(-9px, 4px);
  border-radius: 3px;
}
.guess-daily-art i:last-child {
  transform: rotate(-18deg) translate(-18px, 9px);
  z-index: -1;
}
.guess-practice-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 29px 0 14px;
}
.guess-practice-heading h2 {
  font-size: 13px;
  font-weight: 500;
  margin: 0;
  color: #d1dcc3;
}
.guess-practice-heading > span {
  font-size: 10px;
  color: #879c7a;
}
.guess-difficulty-foot {
  margin: 19px 0 0;
  color: #8d9f80;
  font-size: 10px;
  line-height: 1.8;
}
/* 地狱档（决策 079）：横跨栅格整行的低调横条，比前三档低一个视觉层级，
   不抢三张主卡的风头；池未收录时禁用（全局 button:disabled 半透明兜底），
   数据集收录该档模型后自动开放。点缀用克制的余烬橙，落在图标与大字号上 */
.guess-difficulty-card[data-level='4'] {
  grid-column: 1 / -1;
  min-height: 0;
  flex-direction: row;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px 22px;
  padding: 16px 22px;
  background: #131d17;
  border-color: #2c3a32;
}
.guess-difficulty-card[data-level='4']:hover:not(:disabled) {
  background: #182720;
  border-color: #5a6b52;
  transform: none;
}
.guess-difficulty-card[data-level='4']:before {
  font-size: 42px;
  top: 50%;
  right: 22px;
  transform: translateY(-50%);
}
.guess-difficulty-card[data-level='4'] .guess-difficulty-icon {
  width: 34px;
  height: 34px;
  color: #d08a5a;
  border-bottom-color: #d08a5a40;
}
.guess-difficulty-card[data-level='4'] .guess-difficulty-name b {
  font-size: 19px;
}
.guess-difficulty-card[data-level='4'] .guess-difficulty-blurb {
  flex: 1 1 200px;
}
.guess-difficulty-card[data-level='4'] .guess-difficulty-meta {
  width: auto;
  margin-top: 0;
  padding-top: 0;
  border-top: 0;
}
.guess-difficulty-card[data-level='4'] .guess-difficulty-go {
  position: static;
}
.guess-picker-pending {
  font-size: 12px;
  color: #c1d79c;
  display: flex;
  align-items: center;
  gap: 8px;
}
@media (max-width: 600px) {
  .guess-difficulty {
    padding-top: 21px;
  }
  .guess-difficulty-head h1 {
    font-size: 58px;
  }
  .guess-difficulty-head p {
    font-size: 11px;
  }
  .guess-difficulty-card.guess-daily-card {
    padding: 23px;
    min-height: 265px;
  }
  .guess-daily-card .guess-difficulty-name b {
    font-size: 27px;
  }
  .guess-daily-card .guess-difficulty-name {
    width: 66%;
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
  }
  .guess-daily-card .guess-difficulty-blurb {
    width: 66%;
    font-size: 10px;
  }
  .guess-daily-card .guess-difficulty-meta {
    width: 100%;
    margin-top: 17px;
  }
  .guess-daily-art {
    width: 70px;
    height: 98px;
    right: 25px;
    top: 42px;
    opacity: 0.65;
  }
  .guess-daily-art > span {
    font-size: 58px;
  }
  .guess-difficulty-grid {
    grid-template-columns: 1fr;
    gap: 11px;
  }
  .guess-difficulty-card {
    min-height: 205px;
    padding: 22px;
  }
  .guess-difficulty-name b {
    font-size: 23px;
  }
  .guess-practice-heading {
    margin-top: 25px;
  }
}

/* 游戏中的当前难度标签：点它回选择屏换难度 */
.guess-difficulty-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 11px;
  background: transparent;
  border: 1px solid #3b4c3d;
  color: #c6cfbb;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition:
    border-color 0.18s,
    color 0.18s;
}
.guess-difficulty-chip small {
  font: 8px var(--mono);
  letter-spacing: 0.16em;
  color: #7c8e79;
}
.guess-difficulty-chip:hover {
  border-color: var(--guess-accent);
  color: var(--guess-accent);
}
.guess-error {
  font-size: 12px;
  color: #f4bb9a;
  border-left: 2px solid #e09a6f;
  padding: 10px 14px;
  background: #e09a6f0a;
}
.guess-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 30px;
  padding: 0 4px 25px;
  border-bottom: 1px solid #33462e;
  gap: 35px;
}
.guess-stats-intro {
  display: flex;
  gap: 12px;
  align-items: center;
  color: #c4d0b7;
  font-size: 12px;
}
.guess-stats-intro small {
  display: block;
  color: #829574;
  font-size: 9px;
  margin-top: 5px;
}
.guess-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 48px;
  margin: 0;
}
.guess-stats dt {
  font-size: 10px;
  color: #94a685;
  margin-bottom: 5px;
}
.guess-stats dd {
  font: 27px var(--mono);
  margin: 0;
  color: #dce6cb;
}
.guess-stats dd small {
  font:
    9px MiSans,
    system-ui;
  margin-left: 5px;
  color: #8b9e7b;
}
.guess-rules {
  font-size: 11px;
  color: #97ab85;
  margin-top: 19px;
  line-height: 1.9;
}
.guess-rules summary {
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  list-style: none;
  width: fit-content;
}
.guess-rules summary::-webkit-details-marker {
  display: none;
}
.guess-rules[open] summary svg {
  transform: rotate(180deg);
}
.guess-rules > div {
  max-width: 740px;
  margin-top: 15px;
}
.guess-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
}
.guess-loading h1 {
  margin: 0;
  font-size: 40px;
}
.guess-loading p {
  font-size: 13px;
  color: #a8ba9b;
}
.guess-loading-symbol {
  color: var(--guess-accent);
  animation: guess-float 4s infinite;
}
.guess-spinner {
  animation: guess-spin 1s linear infinite;
}
@keyframes guess-enter {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes guess-menu {
  from {
    opacity: 0;
    transform: translateY(-5px) scaleY(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scaleY(1);
  }
}
@keyframes guess-float {
  0%,
  100% {
    transform: translateY(0) rotate(9deg);
  }
  50% {
    transform: translateY(-10px) rotate(6deg);
  }
}
@keyframes guess-tile {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
@keyframes guess-uncover {
  to {

/** 四档难度（层叠）：难度 k 的池 = difficulty ≤ k 的全部模型 */
const GUESS_DIFFICULTIES = [1, 2, 3, 4];
const DIFFICULTY_INFO = [
  { zh: '简单', en: 'Easy' },
  { zh: '普通', en: 'Common' },
  { zh: '困难', en: 'Hard' },
  { zh: '地狱', en: 'Hell' },
];

/** 某难度的候选池（层叠：difficulty ≤ k，保持数据集原序即热度降序） */
function poolForDifficulty(models, difficulty) {
  return models.filter((m) => m.difficulty <= difficulty);
}

/** 每日一题的答案池：普通池上限 = 2（简单+普通） */
const DAILY_DIFFICULTIES = [1, 2];
function dailyPool(models) {
  return models.filter((m) => m.difficulty <= 2);
}

/** 价格档边界：priceOut < 0.5 → 0 档；< 2 → 1；< 8 → 2；< 25 → 3；≥ 25 → 4 */
const PRICE_BAND_EDGES = [0.5, 2, 8, 25];

/** 厂商 → 国家/地区（厂商格「同国家给黄」） */
const VENDOR_REGION = {
  'DeepSeek': 'CN',
  'Moonshot AI': 'CN',
  'Zhipu AI (Z.ai)': 'CN',
  'MiniMax': 'CN',
  'Alibaba': 'CN',
  'Xiaomi': 'CN',

  'OpenAI': 'US',
  'Anthropic': 'US',
  'Google': 'US',

  'xAI': 'US',
  'Microsoft': 'US',
  'Thinking Machines': 'US',
  'LMSYS': 'US',
  'Stanford': 'US',
  'NVIDIA': 'US',
  'Poolside': 'US',
  'Amazon': 'US',
  'Inception': 'US',
  'Aion Labs': 'US',
  'Sao10K': 'US',
  'IBM': 'US',
  'Mistral': 'FR',
  'Upstage': 'KR',
};

function priceBandOf(priceOut) {
  if (priceOut === null || !Number.isFinite(priceOut)) return null;
  for (let i = 0; i < PRICE_BAND_EDGES.length; i++)
    if (priceOut < PRICE_BAND_EDGES[i]) return i;
  return PRICE_BAND_EDGES.length;
}

function toModel(entry, group) {
  return {
    id: entry.id,
    name: entry.name,
    vendor: entry.org,
    region: VENDOR_REGION[entry.org] ?? '??',
    released: `${entry.year}-${String(entry.month).padStart(2, '0')}`,
    openWeights: entry.openWeights,
    contextK: entry.contextK,
    modalities: entry.modality.split('+'),
    reasoning: entry.reasoning,
    priceOut: entry.priceOut,
    priceTier: priceBandOf(entry.priceOut),
    popularity: entry.popularity,
    difficulty: (entry.difficulty ?? (group ? group.difficulty : undefined)),
    sinceDay: entry.sinceDay ?? (group ? group.sinceDay : undefined),
    groupId: group ? group.id : undefined,
  };
}

// 合并组：带 variants 的条目展开为「组内每个小版本一个可猜模型」，
// 组条目本身不可猜也不可当答案
function normalizeEntry(entry) {
  if (!entry.variants || !entry.variants.length) return [toModel(entry)];
  return entry.variants.map((v) => toModel(v, entry));
}

const GUESS_MODELS = RAW_DATA.models.flatMap(normalizeEntry);
const modelById = new Map(GUESS_MODELS.map((m) => [m.id, m]));

/** 价格档显示文案，index = priceTier（0-4） */
const PRICE_TIERS = [
  { zh: '近免费', en: 'Near-free' },
  { zh: '便宜', en: 'Cheap' },
  { zh: '中等', en: 'Mid' },
  { zh: '贵', en: 'High' },
  { zh: '旗舰', en: 'Premium' },
];

/** 属性 key。顺序即反馈格渲染顺序 */
const ATTRIBUTE_KEYS = [
  'vendor',
  'released',
  'openWeights',
  'contextK',
  'modalities',
  'reasoning',
  'priceTier',
];

// ── 手感参数：黄阈值 ──
const GUESS_CONFIG = {
  releasedNearMonths: 6,
  contextNearRatio: 2,
};

/** 玩家输入 → 模型（name 不区分大小写匹配；null = 没猜到） */
function resolveGuess(name) {
  const key = name.trim().toLowerCase();
  if (!key) return null;
  return GUESS_MODELS.find((m) => m.name.toLowerCase() === key) ?? null;
}

// 搜索规范化：剥掉大小写与一切分隔符
function normalizeGuessKey(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g, '');
}

/** 搜索框补全候选：规范化子串匹配 + 多词乱序兜底。
 *  档位：规范化全等 > 前缀 > 名字/id 子串 > 逐词全命中；同档内按 released 倒序 */
function searchGuessModels(models, rawQuery, limit = 8) {
  const q = normalizeGuessKey(rawQuery);
  if (!q) return [];
  const tokens = rawQuery
    .toLowerCase()
    .split(/[^a-z0-9]+/)
    .filter(Boolean);
  const scored = models
    .map((m) => {
      const name = normalizeGuessKey(m.name);
      const id = normalizeGuessKey(m.id);
      if (name === q) return { m, rank: 0 };
      if (name.startsWith(q)) return { m, rank: 1 };
      if (name.includes(q) || id.includes(q)) return { m, rank: 2 };
      if (
        tokens.length > 1 &&
        tokens.every((tk) => name.includes(tk) || id.includes(tk))
      )
        return { m, rank: 3 };
      return null;
    })
    .filter((x) => x !== null);
  scored.sort(
    (a, b) =>
      a.rank - b.rank ||
      (b.m.released ?? '').localeCompare(a.m.released ?? '') ||
      a.m.name.localeCompare(b.m.name),
  );
  return scored.slice(0, limit).map((x) => x.m);
}

function monthIndex(released) {
  const match = /^(\d{4})-(\d{2})$/.exec(released);
  if (!match) throw new Error(`bad released: ${released}`);
  return Number(match[1]) * 12 + Number(match[2]) - 1;
}

function judgeNumeric(guessValue, answerValue, nearThreshold, mode) {
  // 未公开：只标 unknown，不给箭头
  if (guessValue === null || answerValue === null)
    return { state: 'unknown', arrow: null };
  if (guessValue === answerValue) return { state: 'hit', arrow: null };
  const arrow = answerValue > guessValue ? 'up' : 'down';
  const near =
    mode === 'ratio'
      ? Math.max(guessValue, answerValue) / Math.min(guessValue, answerValue) <=
        nearThreshold
      : Math.abs(guessValue - answerValue) <= nearThreshold;
  return { state: near ? 'near' : 'miss', arrow };
}

/** 判定一次猜测（核心函数） */
function judge(guess, answer) {
  const attributes = {};

  // 厂商：同厂商=绿；不同厂商但同国家/地区=黄；跨国=灰。无箭头
  attributes.vendor =
    guess.vendor === answer.vendor
      ? { state: 'hit', arrow: null }
      : guess.region === answer.region
        ? { state: 'near', arrow: null }
        : { state: 'miss', arrow: null };

  // 发布时间：月序号比较
  attributes.released = judgeNumeric(
    monthIndex(guess.released),
    monthIndex(answer.released),
    GUESS_CONFIG.releasedNearMonths,
    'diff',
  );

  // 开放权重：二值
  attributes.openWeights =
    guess.openWeights === answer.openWeights
      ? { state: 'hit', arrow: null }
      : { state: 'miss', arrow: null };

  // 上下文窗口：比值接近
  attributes.contextK = judgeNumeric(
    guess.contextK,
    answer.contextK,
    GUESS_CONFIG.contextNearRatio,
    'ratio',
  );

  // 模态：二元口径（纯文本 / 多模态）。同纯文本=绿；同多模态=黄（恒黄）；一纯一多=灰
  const guessMulti = guess.modalities.some((m) => m !== 'text');
  const answerMulti = answer.modalities.some((m) => m !== 'text');
  attributes.modalities =
    guessMulti !== answerMulti
      ? { state: 'miss', arrow: null }
      : { state: answerMulti ? 'near' : 'hit', arrow: null };

  // 推理模型：二值
  attributes.reasoning =
    guess.reasoning === answer.reasoning
      ? { state: 'hit', arrow: null }
      : { state: 'miss', arrow: null };

  // 价格档：档位序数比较（0-4）。相邻档给黄、差 ≥2 给灰 + 箭头
  if (guess.priceTier === null || answer.priceTier === null) {
    attributes.priceTier = { state: 'unknown', arrow: null };
  } else if (guess.priceTier === answer.priceTier) {
    attributes.priceTier = { state: 'hit', arrow: null };
  } else {
    attributes.priceTier = {
      state:
        Math.abs(guess.priceTier - answer.priceTier) === 1 ? 'near' : 'miss',
      arrow: answer.priceTier > guess.priceTier ? 'up' : 'down',
    };
  }

  return {
    guessId: guess.id,
    attributes,
    won: guess.id === answer.id,
  };
}

// ── 每日一题派生 ──
// 同一天全世界同答案；不引随机源；数据集末尾追加（带 sinceDay）不改历史答案。

/** 数据集冻结锚点：模一把上线日。改它=重排所有历史答案 */
const GUESS_EPOCH = '2026-09-13';

/** UTC+8 日历日（模一把的「一天」按东八区切） */
function guessDayKey(date = new Date()) {
  const shifted = new Date(date.getTime() + 8 * 3600 * 1000);
  return shifted.toISOString().slice(0, 10);
}

/** 距 epoch 的天数（epoch=0）。Date.UTC 真历法差 */
function dayNumber(date = new Date()) {
  const key = guessDayKey(date);
  const ms = Date.UTC(
    Number(key.slice(0, 4)),
    Number(key.slice(5, 7)) - 1,
    Number(key.slice(8, 10)),
  );
  const epochMs = Date.UTC(
    Number(GUESS_EPOCH.slice(0, 4)),
    Number(GUESS_EPOCH.slice(5, 7)) - 1,
    Number(GUESS_EPOCH.slice(8, 10)),
  );
  return Math.round((ms - epochMs) / 86400000);
}

/**
 * 每日答案：确定性派生，无随机源。
 * 两层散列混合把相邻日期打散；两级派生：第一层散列选答案槽（组或独立条目），
 * 第二层在组内按「该槽第几次被抽中」轮转实例化版本。
 */
function answerForDate(date = new Date(), pool = GUESS_MODELS) {
  // 负序号（上线前的日期）clamp 到 0
  const n = Math.max(0, dayNumber(date));
  // 第一层：答案槽去重（同组只占一槽），保持池内首次出现顺序保证确定性
  const slots = new Map();
  for (const m of pool) {
    const key = m.groupId ?? m.id;
    const slot = slots.get(key);
    if (slot) slot.push(m);
    else slots.set(key, [m]);
  }
  // 基础槽 / 追加槽分流（追加不改历史的关键）
  const baseSlots = [];
  const extraSlots = [];
  for (const slot of slots.values())
    (slot[0].sinceDay === undefined ? baseSlots : extraSlots).push(slot);
  const select = (d) => {
    const h = (d * 2654435761) % 0xffffffff;
    const eligible = extraSlots.filter((s) => (s[0].sinceDay ?? 0) <= d);
    const r = h % (baseSlots.length + eligible.length);
    return r < baseSlots.length ? baseSlots[r] : eligible[r - baseSlots.length];
  };
  const slot = select(n);
  if (slot.length === 1) return slot[0];
  // 第二层：第 hitCount 次命中该槽取第 hitCount 个版本（轮转，天然全覆盖）
  let hits = 0;
  for (let d = 0; d < n; d++) if (select(d) === slot) hits++;
  return slot[hits % slot.length];
}

    'rotate-ccw': '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
    'chevron-down': '<path d="m6 9 6 6 6-6"/>',
    'sprout': '<path d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3"/><path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4"/><path d="M5 21h14"/>',
    'compass': '<circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/>',
    'flame': '<path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/>',
    'skull': '<path d="m12.5 17-.5-1-.5 1h1z"/><path d="M15 22a1 1 0 0 0 1-1v-1a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20v1a1 1 0 0 0 1 1z"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="12" r="1"/>',
  };
  function icon(name, size = 16, sw = 2) {
    return (
      '<svg xmlns="http://www.w3.org/2000/svg" width="' + size +
      '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + sw +
      '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>'
    );
  }

  // ── 战绩存取（lib/guess.ts 本地部分同口径；独立版不迁移旧键）──
  function readJson(key) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch {
      return null;
    }
  }
  function writeJson(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch {
      /* 存储不可用：当次会话内存态继续可用 */
    }
  }
  function wasCounted(dayKey) {
    try {
      return localStorage.getItem(settledKey(dayKey)) === '1';
    } catch {
      return false;
    }
  }
  function markCounted(dayKey) {
    try {
      localStorage.setItem(settledKey(dayKey), '1');
    } catch {}
  }
  function loadStats() {
    return (
      readJson(STATS_KEY) ?? { played: 0, won: 0, streak: 0, best: null }
    );
  }
  // 连胜宽松口径：只有「玩了且输了」才断，隔天没玩不断（Wordle 同款）
  function settleStats(dayKey, won, attempts) {
    const stats = loadStats();
    const next = {
      played: stats.played + 1,
      won: stats.won + (won ? 1 : 0),
      streak: won ? stats.streak + 1 : 0,
      best: won
        ? stats.best === null
          ? attempts
          : Math.min(stats.best, attempts)
        : stats.best,
    };
    writeJson(STATS_KEY, next);
    writeJson(LAST_DAY_KEY, dayKey);
  }

  // ── 属性格显示值（app/guess.tsx attributeValue 同口径）──
  const ATTRIBUTE_LABELS = {
    vendor: '厂商',
    released: '发布',
    openWeights: '权重',
    contextK: '上下文',
    modalities: '模态',
    reasoning: '推理',
    priceTier: '价格',
  };
  function attributeValue(model, key) {
    switch (key) {
      case 'vendor':
        return model.vendor;
      case 'released':
        return model.released;
      case 'openWeights':
        return model.openWeights ? '开放' : '闭源';
      case 'contextK':
        return model.contextK === null ? '?' : `${model.contextK}K`;
      case 'modalities': {
        const extra = model.modalities.filter((m) => m !== 'text');
        if (extra.length === 0) return '纯文本';
        const map = { image: '图', audio: '音', video: '视' };
        return extra.map((m) => map[m] ?? m).join('+');
      }
      case 'reasoning':
        return model.reasoning ? '推理' : '直答';
      case 'priceTier':
        return model.priceTier === null ? '?' : PRICE_TIERS[model.priceTier].zh;
      default:
        return '?';
    }
  }

  const DIFFICULTY_ICONS = ['sprout', 'compass', 'flame', 'skull'];
  const DIFFICULTY_BLURBS = [
    '热门模型专场，都叫得上名字',
    '热门与主流都在场，答案得绕点弯',
    '上面两档之外，经典与冷门也进场',
    '全库上阵，含只在这里出没的化石与传说',
  ];

  // ── 状态 ──
  const emptySession = () => ({
    guesses: [],
    finished: false,
    revealed: false,
    answer: null,
  });
  const state = {
    mode: null, // null 选择屏；'daily' 每日一题；1-4 练习难度
    session: null,
    dayKey: null,
    dayNumber: null,
    dailyAnswer: null,
    practiceAnswer: null,
    query: '',
    open: false,
    activeIndex: 0,
    error: null,
    freshGuess: null,
    settled: false,
    stats: loadStats(),
  };
  const animatedRows = new Set(); // 每行逐格揭示只播一次

  const root = document.getElementById('root');
  const main = document.getElementById('main');

  function currentAnswer() {
    return state.mode === 'daily' ? state.dailyAnswer : state.practiceAnswer;
  }
  function canGuess() {
    const s = state.session;
    return !!s && !s.finished && !s.revealed && s.guesses.length < MAX_ATTEMPTS;
  }

  // ── 抽题 ──
  // 练习：合并组算一槽、组内随机版本（与主站 practice/start 同语义）
  function pickPracticeAnswer(difficulty) {
    const pool = poolForDifficulty(GUESS_MODELS, difficulty);
    if (!pool.length) return null;
    const slots = new Map();
    for (const m of pool) {
      const key = m.groupId ?? m.id;
      const slot = slots.get(key);
      if (slot) slot.push(m);
      else slots.set(key, [m]);
    }
    const groups = [...slots.values()];
    const slot = groups[Math.floor(Math.random() * groups.length)];
    return slot[Math.floor(Math.random() * slot.length)];
  }

  // ── 结算（只记每日一题，一天一次）──
  function settleIfDue() {
    const s = state.session;
    if (state.mode !== 'daily' || !s || !s.finished || state.settled) return;
    if (wasCounted(state.dayKey)) {
      state.settled = true;
      return;
    }
    state.settled = true;
    const won = s.guesses.some((r) => r.won);
    settleStats(state.dayKey, won, s.guesses.length);
    markCounted(state.dayKey);
    state.stats = loadStats();
  }

  // 跨零点守护（UTC+8）：页面开着跨过零点后，旧棋盘混两个答案，换新题
  function dailyRolledOver() {
    if (state.mode !== 'daily' || !state.dayKey) return false;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(state.dayKey)) return false;
    if (guessDayKey() === state.dayKey) return false;
    enterDaily();
    state.error = '已过零点，新的一天开始了——已为你切到今天的题。';
    updateError();
    return true;
  }

  // ── 翻页过场（folio，与主站 createGameTransition('folio') 同口径）──
  // 轻薄实色幕横扫：盖满时换屏，再扫出。独立版无重 WebGL 加载，
  // 不需要主站那套帧时间防卡顿机制，直接用 WAAPI 时间线。
  const FOLIO = { covered: 230, exitStart: 310, duration: 570 };
  function reducedMotion() {
    return (
      document.documentElement.classList.contains('guess-reduced') ||
      (window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches)
    );
  }
  function folioTransition(direction, onCovered, onFinish) {
    if (reducedMotion()) {
      onCovered();
      onFinish();
      return;
    }
    const sign = direction === 'back' ? -1 : 1;
    const ease = 'cubic-bezier(.76,0,.24,1)';
    const layer = document.createElement('div');
    layer.className = 'game-transition gt-folio';
    layer.setAttribute('aria-hidden', 'true');
    const leaf = document.createElement('div');
    leaf.className = 'gt-folio-leaf';
    layer.append(leaf);
    document.body.append(layer);
    const anim = leaf.animate(
      [
        { transform: `translateX(${sign * 102}%)`, offset: 0, easing: ease },
        { transform: 'translateX(0)', offset: FOLIO.covered / FOLIO.duration },
        {
          transform: 'translateX(0)',
          offset: FOLIO.exitStart / FOLIO.duration,
          easing: ease,
        },
        { transform: `translateX(${-sign * 102}%)`, offset: 1 },
      ],
      { duration: FOLIO.duration, fill: 'both', easing: 'linear' },
    );
    let coveredFired = false;
    const fireCovered = () => {
      if (coveredFired) return;
      coveredFired = true;
      onCovered();
    };
    const tick = () => {
      const t = anim.currentTime;
      if (typeof t === 'number' && t >= FOLIO.covered) fireCovered();
      if (anim.playState !== 'finished') requestAnimationFrame(tick);
    };
    anim.onfinish = () => {
      fireCovered();
      layer.remove();
      onFinish();
    };
    requestAnimationFrame(tick);
  }

  let switching = false;
  function changeScreen(commit, direction = 'forward') {
    if (switching) return;
    switching = true;
    folioTransition(
      direction,
      () => {
        commit();
        window.scrollTo({ top: 0, behavior: 'instant' });
      },
      () => {
        switching = false;
        main.focus({ preventScroll: true });
      },
    );
  }

  // ── 发牌入场（deal，与主站 guessNavigate 的 createGameTransition('deal') 同口径）──
  // 打开页面时播一次：背卡飞入、密牌放大盖满、停顿揭示文案、双半屏拉开。
  const DEAL = { covered: 720, exitStart: 1370, duration: 2020 };
  function dealEntrance(onCovered, onDone) {
    if (reducedMotion()) {
      if (onCovered) onCovered();
      if (onDone) onDone();
      return;
    }
    const { covered, exitStart, duration } = DEAL;
    const dwell = exitStart - covered;
    const ease = 'cubic-bezier(.76,0,.24,1)';
    const layer = document.createElement('div');
    layer.className = 'game-transition gt-deal';
    layer.setAttribute('aria-hidden', 'true');
    document.body.append(layer);
    const el = (className, parent, text) => {
      const node = document.createElement('div');
      node.className = className;
      if (text !== undefined) node.textContent = text;
      (parent || layer).append(node);
      return node;
    };
    const track = (node, frames, start, dur, easing) =>
      node.animate(frames, {
        delay: start,
        duration: dur,
        fill: 'both',
        easing: easing || ease,
      });
    const move = (node, from, to, start, dur) =>
      track(node, [{ transform: from }, { transform: to }], start, dur);
    const fade = (node, from, to, start, dur) =>
      track(node, [{ opacity: from }, { opacity: to }], start, dur, 'linear');

    for (let i = 0; i < 2; i++) {
      const back = el(`gt-deal-back gt-deal-back-${i}`);
      track(
        back,
        [
          {
            transform: `translateY(120%) rotate(${-18 + i * 7}deg) scale(.22)`,
            opacity: 1,
            offset: 0,
          },
          {
            transform: `translateY(0) rotate(${-9 + i * 15}deg) scale(.32)`,
            opacity: 1,
            offset: 0.48,
          },
          { transform: 'translateY(0) rotate(0deg) scale(1.04)', opacity: 1, offset: 0.88 },
          { transform: 'translateY(0) rotate(0deg) scale(1.04)', opacity: 0, offset: 1 },
        ],
        i * 35,
        covered + 90,
        ease,
      );
    }
    const shell = el('gt-deal-shell');
    track(
      shell,
      [
        {
          transform: 'translateY(125%) rotate(-11deg) scale(.22)',
          offset: 0,
          easing: 'cubic-bezier(.16,1,.3,1)',
        },
        {
          transform: 'translateY(0) rotate(4deg) scale(.32)',
          offset: 0.46,
          easing: 'cubic-bezier(.7,0,.15,1)',
        },
        { transform: 'translateY(0) rotate(0deg) scale(1)', offset: 1 },
      ],
      0,
      covered,
      'linear',
    );
    for (let i = 0; i < 2; i++) {
      const half = el(`gt-deal-half gt-deal-half-${i}`, shell);
      move(half, 'translateX(0)', `translateX(${i ? 101 : -101}%)`, exitStart, 650);
    }
    const seal = el('gt-deal-seal', shell, '?');
    fade(seal, 1, 0, covered - 150, 150);
    const copy = el('gt-deal-copy', shell);
    const info = el('gt-deal-info', copy);
    el('gt-deal-kicker', info, '每日谜题');
    el('gt-deal-title', info, '模一把');
    el('gt-deal-note', info, '七条线索，锁定一个名字。');
    const clues = el('gt-deal-clues', info);
    for (let i = 0; i < 7; i++) {
      const clue = el('gt-deal-clue', clues, String(i + 1).padStart(2, '0'));
      track(
        clue,
        [
          { opacity: 0.18, transform: 'translateY(3px)' },
          { opacity: 1, transform: 'translateY(0)' },
        ],
        covered + (dwell * i) / 10,
        Math.min(160, dwell * 0.35),
      );
    }
    const symbol = el('gt-deal-symbol', copy);
    el('gt-deal-orbit', symbol);
    el('gt-deal-mystery', symbol, '?');
    el('gt-deal-count', symbol, '08');
    el('gt-deal-count-label', symbol, '次机会');
    const sheen = el('gt-deal-sheen', symbol);
    track(
      sheen,
      [
        { transform: 'translateX(-160%) rotate(-20deg)', opacity: 0 },
        { transform: 'translateX(0) rotate(-20deg)', opacity: 0.22, offset: 0.45 },
        { transform: 'translateX(180%) rotate(-20deg)', opacity: 0 },
      ],
      covered + 50,
      dwell + 80,
      'cubic-bezier(.22,.6,.3,1)',
    );
    track(
      copy,
      [
        { opacity: 0, transform: 'translateY(9px)', offset: 0 },
        { opacity: 1, transform: 'translateY(0)', offset: 0.2 },
        { opacity: 1, transform: 'translateY(0)', offset: 0.8 },
        { opacity: 0, transform: 'translateY(-8px)', offset: 1 },
      ],
      covered,
      dwell + 150,
      'linear',
    );
    move(
      symbol,
      'perspective(1000px) rotateY(-18deg) rotate(-6deg)',
      'perspective(1000px) rotateY(-3deg) rotate(1deg)',
      covered,
      dwell + 150,
    );

    const t0 = performance.now();
    let coveredFired = false;
    const fireCovered = () => {
      if (coveredFired) return;
      coveredFired = true;
      if (onCovered) onCovered();
    };
    const tick = (now) => {
      const t = now - t0;
      if (t >= covered) fireCovered();
      if (t < duration) {
        requestAnimationFrame(tick);
        return;
      }
      layer.remove();
      fireCovered();
      if (onDone) onDone();
    };
    requestAnimationFrame(tick);
  }

  // ── 流程 ──
  function enterDaily(animate) {
    const commit = () => {
      state.mode = 'daily';
      state.dayKey = guessDayKey();
      state.dayNumber = dayNumber();
      state.dailyAnswer = answerForDate(new Date(), dailyPool(GUESS_MODELS));
      state.practiceAnswer = null;
      state.session = emptySession();
      state.stats = loadStats();
      state.settled = false;
      resetRoundUi();
      showGame();
    };
    if (animate) changeScreen(commit);
    else commit();
  }

  function enterPractice(d, animate) {
    const pool = poolForDifficulty(GUESS_MODELS, d);
    if (!pool.length) {
      state.error = '这一档还没有收录模型，先玩别的难度吧。';
      renderPicker();
      return;
    }
    const commit = () => {
      state.mode = d;
      state.dayKey = guessDayKey();
      state.dayNumber = dayNumber();
      state.dailyAnswer = null;
      state.practiceAnswer = pickPracticeAnswer(d);
      state.session = emptySession();
      state.settled = false;
      resetRoundUi();
      showGame();
    };
    if (animate) changeScreen(commit);
    else commit();
  }

  function resetRoundUi() {
    state.query = '';
    state.open = false;
    state.activeIndex = 0;
    state.error = null;
    state.freshGuess = null;
    animatedRows.clear();
  }

  function backToPicker(animate) {
    const commit = () => {
      state.mode = null;
      state.session = null;
      state.dailyAnswer = null;
      state.practiceAnswer = null;
      resetRoundUi();
      renderPicker();
    };
    if (animate) changeScreen(commit, 'back');
    else commit();
  }

  // 重玩今天（每日一题）：清盘重开，答案不变，战绩不重复结算
  function replay() {
    if (state.mode !== 'daily') return;
    state.session = emptySession();
    resetRoundUi();
    updateAll();
  }

  // 再来一把（练习模式）：同难度开新随机题
  function playAgain() {
    if (state.mode === null || state.mode === 'daily') return;
    state.practiceAnswer = pickPracticeAnswer(state.mode);
    state.session = emptySession();
    resetRoundUi();
    updateAll();
  }

  function submit(model) {
    if (!model || !canGuess()) return;
    if (dailyRolledOver()) return;
    const answer = currentAnswer();
    if (!answer) return;
    const fb = judge(model, answer);
    const s = state.session;
    s.guesses = s.guesses.concat([{ guess: model, attributes: fb.attributes, won: fb.won }]);
    const isFinalAttempt = s.guesses.length === MAX_ATTEMPTS;
    s.finished = fb.won || isFinalAttempt;
    s.revealed = fb.won || isFinalAttempt;
    s.answer = s.finished ? answer : null;
    state.query = '';
    state.open = false;
    state.activeIndex = 0;
    state.error = null;
    state.freshGuess = model.id;
    settleIfDue();
    updateAll();
    focusInput();
  }

  // 手动看答案（按负场结算，与主站同口径）
  function revealAnswer() {
    const s = state.session;
    if (!s || !s.guesses.length) return;
    if (dailyRolledOver()) return;
    s.revealed = true;
    s.finished = true;
    s.answer = currentAnswer();
    state.error = null;
    settleIfDue();
    updateAll();
  }

  // ── 渲染 ──
  function esc(s) {
    return String(s).replace(
      /[&<>"]/g,
      (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c],
    );
  }

  function feedbackCellHtml(fb, value, index, label) {
    const status =
      fb.state === 'hit' ? '吻合' : fb.state === 'near' ? '接近' : fb.state === 'unknown' ? '未公开' : '不符';
    const arrow = fb.arrow;
    const indicator = arrow
      ? arrow === 'up'
        ? icon('arrow-up', 13)
        : icon('arrow-down', 13)
      : fb.state === 'hit'
        ? icon('check', 12)
        : fb.state === 'unknown'
          ? '?'
          : '<span class="gcell-dash"></span>';
    const aria =
      label + ': ' + value + ', ' + status +
      (arrow ? ', ' + (arrow === 'up' ? '答案更大或更新' : '答案更小或更早') : '');
    return (
      '<td class="gcell ' + fb.state + '" style="--cell-order:' + index +
      '" aria-label="' + esc(aria) + '">' +
      '<span class="gcell-value">' + esc(value) + '</span>' +
      '<span class="gcell-indicator" aria-hidden="true">' + indicator + '</span></td>'
    );
  }

  function editionHtml() {
    const num = String(state.dayNumber).padStart(3, '0');
    if (state.mode === 'daily')
      return (
        '<div class="guess-edition"><span>每日挑战</span><b>#' + num + '</b><span>' +
        esc(state.dayKey.replaceAll('-', '.')) + '</span></div>'
      );
    return (
      '<div class="guess-edition"><span>练习模式</span><b>' +
      esc(DIFFICULTY_INFO[state.mode - 1].zh) + '</b><span>随机出题</span></div>'
    );
  }

  function renderPicker() {
    root.dataset.screen = 'picker';
    const dayKey = guessDayKey();
    const num = String(dayNumber()).padStart(3, '0');
    const done = wasCounted(dayKey);
    const dailyCount = dailyPool(GUESS_MODELS).length;

    let cards = '';
    for (const d of GUESS_DIFFICULTIES) {
      const info = DIFFICULTY_INFO[d - 1];
      const count = poolForDifficulty(GUESS_MODELS, d).length;
      const unavailable = count === 0;
      cards +=
        '<button type="button" class="guess-difficulty-card" data-level="' + d +
        '" data-action="enter-practice" data-difficulty="' + d + '"' +
        (unavailable ? ' disabled' : '') + '>' +
        '<span class="guess-difficulty-icon" aria-hidden="true">' + icon(DIFFICULTY_ICONS[d - 1], 26, 1.6) + '</span>' +
        '<span class="guess-difficulty-name"><b>' + esc(info.zh) + '</b><small>' +
        String(d).padStart(2, '0') + ' / ' + String(GUESS_DIFFICULTIES.length).padStart(2, '0') + '</small></span>' +
        '<span class="guess-difficulty-blurb">' + esc(DIFFICULTY_BLURBS[d - 1]) + '</span>' +
        '<span class="guess-difficulty-meta"><span>候选 ' + count + ' 个模型</span>' +
        '<span class="guess-difficulty-status is-fresh">' +
        (unavailable ? '筹备中' : '随机出题 · 不限次数') + '</span></span>' +
        icon('arrow-up-right', 18).replace('<svg ', '<svg class="guess-difficulty-go" ') +
        '</button>';
    }

    main.innerHTML =
      '<section class="guess-difficulty" aria-labelledby="guess-difficulty-title">' +
      '<div class="guess-difficulty-head">' +
      '<div class="guess-edition"><span>每日挑战</span><b>#' + num + '</b><span>' +
      esc(dayKey.replaceAll('-', '.')) + '</span></div>' +
      '<h1 id="guess-difficulty-title">模一把<span aria-hidden="true">↗</span></h1>' +
      '<p>每天一道全世界同题；或者选个难度练习，随机出题不限次。</p></div>' +
      '<button type="button" class="guess-difficulty-card guess-daily-card" data-action="enter-daily">' +
      '<span class="guess-daily-art" aria-hidden="true"><span>?</span><i></i><i></i></span>' +
      '<span class="guess-difficulty-icon" aria-hidden="true">' + icon('trophy', 26, 1.6) + '</span>' +
      '<span class="guess-difficulty-name"><b>每日一题</b><small>全球同题</small></span>' +
      '<span class="guess-difficulty-blurb">全世界同一道题，从热门与主流模型里出，猜完见分晓。</span>' +
      '<span class="guess-difficulty-meta"><span>候选 ' + dailyCount + ' 个模型</span>' +
      '<span class="guess-difficulty-status is-' + (done ? 'done' : 'fresh') + '">' +
      (done ? '今日战绩已记录' : '今天还没玩') + '</span></span>' +
      icon('arrow-up-right', 18).replace('<svg ', '<svg class="guess-difficulty-go" ') +
      '</button>' +
      '<div class="guess-practice-heading"><h2>练习模式</h2><span>随机出题 · 不限次数</span></div>' +
      '<div class="guess-difficulty-grid">' + cards + '</div>' +
      (state.error ? '<p class="guess-error" role="alert">' + esc(state.error) + '</p>' : '') +
      '<p class="guess-difficulty-foot">每日一题只从简单与普通池出；练习不限次，战绩只记每日题。</p>' +
      '</section>';
  }

  function showGame() {
    root.dataset.screen = 'game';
    const won = state.session.guesses.some((r) => r.won);
    const poolSize =
      state.mode === 'daily'
        ? dailyPool(GUESS_MODELS).length
        : poolForDifficulty(GUESS_MODELS, state.mode).length;

    main.innerHTML =
      '<section class="guess-hero" aria-labelledby="guess-title">' +
      '<div class="guess-hero-copy">' +
      '<a class="guess-back" data-action="back-picker">' + icon('arrow-left', 14) + '返回选择模式</a>' +
      editionHtml() +
      '<h1 id="guess-title">模一把<span aria-hidden="true">↗</span></h1>' +
      '<p class="guess-tagline">把它的名字，猜出来。</p>' +
      '<p class="guess-intro">' +
      (state.mode === 'daily'
        ? '七条线索，八次机会。今天的 AI 模型，会是谁？'
        : '七条线索，八次机会。不限次数，再来一把。') +
      '</p></div>' +
      '<div class="guess-art' + (won ? ' is-solved' : '') + '" id="guess-art" aria-hidden="true">' +
      '<div class="guess-art-orbit orbit-one"></div>' +
      '<div class="guess-art-orbit orbit-two"></div>' +
      '<div class="guess-card-stack">' +
      '<div class="guess-card-sheet sheet-back"></div>' +
      '<div class="guess-card-sheet sheet-mid"></div>' +
      '<div class="guess-card-sheet sheet-front">' +
      '<div class="guess-card-top">' + icon('brain-circuit', 22) + '<span>#' + String(state.dayNumber).padStart(3, '0') + '</span></div>' +
      '<strong>' + (won ? icon('check', 106, 1.5) : '?') + '</strong>' +
      '<div class="guess-card-bottom"><span>' + (won ? '身份已揭晓' : '今日未知模型') + '</span>' + icon('fingerprint', 24) + '</div>' +
      '</div></div>' +
      '<div class="guess-art-shadow"></div>' +
      '<div class="guess-art-caption"><span id="pool-size">' + poolSize + '</span>个模型，唯一答案</div>' +
      '</div></section>' +
      '<section class="guess-console" aria-label="猜模型">' +
      '<div class="guess-console-top" id="console-top"></div>' +
      '<div id="search-area"></div>' +
      '<div id="error-slot"></div>' +
      '<div class="guess-board-heading"><h2>推理记录</h2><div class="guess-legend">' +
      '<span><i class="hit"></i>吻合</span><span><i class="near"></i>接近</span><span><i class="miss"></i>不符</span>' +
      '</div></div>' +
      '<div class="guess-board-scroll" tabindex="0" role="region" aria-label="猜测历史，可横向滚动">' +
      '<table class="guess-board" aria-label="猜测历史"><thead><tr class="guess-row guess-row-head">' +
      '<th class="gcell-name" scope="col">模型</th>' +
      ATTRIBUTE_KEYS.map((k) => '<th scope="col">' + ATTRIBUTE_LABELS[k] + '</th>').join('') +
      '</tr></thead><tbody id="board-body"></tbody></table></div>' +
      '<div id="empty-slot"></div>' +
      '<div class="guess-board-foot"><span>↑ ↓ 指向答案的方向</span><span>? 表示未公开，不计对错</span></div>' +
      '</section>' +
      '<div id="stats-slot"></div>' +
      '<details class="guess-rules"><summary>怎么玩' + icon('chevron-down', 14) + '</summary><div>' +
      '<p>每日一题全世界同一道题（东八区零点更新），只从热门与主流模型里出；练习模式选难度随机出题、不限次数。反馈规则：厂商相同为绿、同国家为黄；发布时间、上下文、价格接近为黄并给箭头方向；「?」表示该属性未公开，不计对错。</p>' +
      '<p>价格按官方 API 输出单价分档；箭头指向答案更高或更低的方向。</p>' +
      '<p>战绩只记每日一题，一天只记一次；练习模式随便刷，不影响连胜。对局不保存：退出或刷新就重新开局，每日题的答案不变。</p>' +
      '</div></details>';

    updateAll();
    if (canGuess()) focusInput();
  }

  function updateAll() {
    updateConsoleTop();
    updateSearchArea();
    updateBoard();
    updateEmpty();
    updateStats();
    updateHero();
    updateError();
    root.dataset.finished = String(!!(state.session && state.session.finished));
    root.dataset.revealing = String(!!state.freshGuess);
  }

  function updateConsoleTop() {
    const s = state.session;
    const attempts = s.guesses.length;
    const won = s.guesses.some((r) => r.won);
    const cg = canGuess();
    const chip =
      '<button type="button" class="guess-difficulty-chip" data-action="back-picker" title="返回选择模式">' +
      (state.mode === 'daily' ? '每日一题<small>DAILY</small>' : esc(DIFFICULTY_INFO[state.mode - 1].zh) + '<small>' + DIFFICULTY_INFO[state.mode - 1].en.toUpperCase() + '</small>') +
      icon('rotate-ccw', 12) + '</button>';
    const turn =
      '<div class="guess-turn"><span>' +
      (s.finished ? (state.mode === 'daily' ? '今日挑战已完成' : '本局结束') : '剩余机会') +
      '</span><strong>' + String(MAX_ATTEMPTS - attempts).padStart(2, '0') +
      '<small> / ' + MAX_ATTEMPTS + '</small></strong></div>';
    let cells = '';
    for (let i = 0; i < MAX_ATTEMPTS; i++) {
      const cls =
        i < attempts
          ? s.guesses[i].won ? 'is-win' : 'is-used'
          : i === attempts && cg ? 'is-current' : '';
      const inner =
        i < attempts && s.guesses[i].won ? icon('check', 14) : String(i + 1).padStart(2, '0');
      cells += '<span class="' + cls + '">' + inner + '</span>';
    }
    document.getElementById('console-top').innerHTML =
      chip + turn + '<div class="guess-attempts" aria-label="已使用 ' + attempts + ' 次机会">' + cells + '</div>';
  }

  function updateSearchArea() {
    const s = state.session;
    const attempts = s.guesses.length;
    const cg = canGuess();
    const area = document.getElementById('search-area');
    if (cg) {
      area.innerHTML =
        '<div class="guess-search-section">' +
        '<div class="guess-input-wrap">' +
        '<div class="guess-input">' + icon('search', 22) +
        '<input id="guess-input" type="text" autocomplete="off" spellcheck="false"' +
        ' placeholder="输入模型名，开始推理…" role="combobox" aria-autocomplete="list"' +
        ' aria-expanded="false" aria-controls="guess-candidates" aria-label="输入要猜的模型名" />' +
        '<button class="guess-submit" type="button" data-action="submit-active" disabled>' +
        '<span>猜一下</span>' + icon('arrow-up-right', 20) + '</button></div>' +
        '<div id="suggest-host"></div></div>' +
        '<p class="guess-search-hint"><span>支持模型名称搜索</span><span>' +
        icon('corner-down-left', 12) + '回车提交</span></p>' +
        (attempts > 0
          ? '<button class="guess-reveal" data-action="reveal">不想猜了，直接看答案</button>'
          : '') +
        '</div>';
      bindInput();
      renderSuggest();
    } else {
      const won = s.guesses.some((r) => r.won);
      const answer = s.answer;
      area.innerHTML =
        '<div class="guess-result ' + (won ? 'is-win' : 'is-loss') + (state.freshGuess ? ' is-fresh' : '') +
        '" aria-live="polite">' +
        '<div class="guess-result-symbol">' + icon(won ? 'trophy' : 'fingerprint', 32) + '</div>' +
        '<div class="guess-result-copy"><span>' +
        (won ? '漂亮，锁定目标。' : state.mode === 'daily' ? '答案揭晓，明天再来。' : '答案揭晓，再来一把？') +
        '</span><h2>' +
        esc(answer ? answer.name : s.guesses.find((r) => r.won) ? s.guesses.find((r) => r.won).guess.name : '…') +
        '</h2><p>' +
        esc(answer ? answer.vendor : '') +
        (won ? ' · 用了 ' + attempts + ' 次猜中' : '') +
        (answer && answer.priceOut != null ? ' · $' + answer.priceOut + '/M' : '') +
        '</p></div>' +
        '<div class="guess-result-actions">' +
        (state.mode === 'daily'
          ? '<button type="button" class="guess-replay" data-action="replay">' + icon('rotate-ccw', 15) + '重玩今天</button>'
          : '<button type="button" class="guess-primary guess-share" data-action="play-again">' + icon('rotate-ccw', 17) + '再来一把</button>') +
        '</div></div>';
    }
  }

  function bindInput() {
    const input = document.getElementById('guess-input');
    if (!input) return;
    input.value = state.query;
    input.addEventListener('input', () => {
      state.query = input.value;
      state.activeIndex = 0;
      state.open = true;
      renderSuggest();
    });
    input.addEventListener('focus', () => {
      state.open = true;
      renderSuggest();
    });
    input.addEventListener('blur', () => {
      state.open = false;
      renderSuggest();
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        state.open = false;
        renderSuggest();
      }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        state.open = true;
        const cands = candidates();
        state.activeIndex = cands.length
          ? (state.activeIndex + (e.key === 'ArrowDown' ? 1 : -1) + cands.length) % cands.length
          : 0;
        renderSuggest();
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        const cands = candidates();
        if (cands.length) submit(cands[Math.min(state.activeIndex, cands.length - 1)]);
      }
    });
  }

  function candidates() {
    const usedIds = new Set(state.session.guesses.map((r) => r.guess.id));
    return searchGuessModels(
      GUESS_MODELS.filter((m) => !usedIds.has(m.id)),
      state.query,
    );
  }

  function renderSuggest() {
    const host = document.getElementById('suggest-host');
    const input = document.getElementById('guess-input');
    const submitBtn = host ? host.parentElement.querySelector('.guess-submit') : null;
    const cands = candidates();
    if (input) {
      input.setAttribute('aria-expanded', String(state.open && state.query.trim() !== ''));
      input.setAttribute(
        'aria-activedescendant',
        state.open && cands.length
          ? 'guess-option-' + Math.min(state.activeIndex, cands.length - 1)
          : '',
      );
    }
    if (submitBtn) submitBtn.disabled = !cands.length;
    if (!host) return;
    if (!state.open || state.query.trim() === '') {
      host.innerHTML = '';
      return;
    }
    const list = cands
      .map(
        (m, i) =>
          '<li id="guess-option-' + i + '" role="option" aria-selected="' + (i === state.activeIndex) + '"' +
          (i === state.activeIndex ? ' class="is-active"' : '') + '>' +
          '<button type="button" tabindex="-1" data-action="pick" data-id="' + esc(m.id) + '" data-index="' + i + '">' +
          '<span class="guess-model-mark">' + esc(m.vendor.slice(0, 1)) + '</span>' +
          '<span><b>' + esc(m.name) + '</b><small>' + esc(m.vendor) + '</small></span>' +
          '<time>' + esc(m.released) + '</time>' + icon('arrow-up-right', 17) +
          '</button></li>',
      )
      .join('');
    host.innerHTML =
      '<div class="guess-suggest"><div class="guess-suggest-heading"><span>匹配的模型</span><span>' +
      icon('corner-down-left', 12) + '确认</span></div>' +
      (cands.length
        ? '<ul id="guess-candidates" role="listbox" aria-label="模型候选">' + list + '</ul>'
        : '<p class="guess-no-match">没有找到这个模型，换个名字试试。</p>') +
      '</div>';
    // 保持键盘选中项可见（只滚列表，不动页面）
    const listEl = document.getElementById('guess-candidates');
    const option = listEl && listEl.children[Math.min(state.activeIndex, cands.length - 1)];
    if (listEl && option) {
      const top = option.getBoundingClientRect().top - listEl.getBoundingClientRect().top + listEl.scrollTop;
      if (top < listEl.scrollTop) listEl.scrollTop = top;
      else if (top + option.offsetHeight > listEl.scrollTop + listEl.clientHeight)
        listEl.scrollTop = top + option.offsetHeight - listEl.clientHeight;
    }
  }

  function updateBoard() {
    const s = state.session;
    const cg = canGuess();
    const rows = s.guesses
      .map((row, rowIndex) => {
        const fresh = row.guess.id === state.freshGuess && !animatedRows.has(row.guess.id);
        if (fresh) animatedRows.add(row.guess.id);
        return (
          '<tr class="guess-row' + (fresh ? ' is-new' : '') + (row.won ? ' is-correct' : '') + '">' +
          '<th class="gcell-name" scope="row"><span class="guess-row-number">' +
          String(rowIndex + 1).padStart(2, '0') + '</span><span><b>' + esc(row.guess.name) +
          '</b><small>' + esc(row.guess.vendor) + '</small></span></th>' +
          ATTRIBUTE_KEYS.map((key, index) => {
            const fb = row.attributes[key] ?? { state: 'unknown', arrow: null };
            return feedbackCellHtml(fb, attributeValue(row.guess, key), index, ATTRIBUTE_LABELS[key]);
          }).join('') +
          '</tr>'
        );
      })
      .join('');
    const ghost = cg
      ? '<tr class="guess-row guess-ghost" aria-hidden="true"><td class="gcell-name">' +
        '<span class="guess-row-number">' + String(s.guesses.length + 1).padStart(2, '0') + '</span>' +
        '<span>下一个猜测</span></td>' +
        ATTRIBUTE_KEYS.map((k) => '<td><span>?</span></td>').join('') + '</tr>'
      : '';
    document.getElementById('board-body').innerHTML = rows + ghost;
  }

  function updateEmpty() {
    const slot = document.getElementById('empty-slot');
    slot.innerHTML = state.session.guesses.length
      ? ''
      : '<div class="guess-empty">' + icon('fingerprint', 30, 1.3) +
        '<div><strong>每一次猜测，离答案更近。</strong><p>先选一个熟悉的模型，七条线索会在这里揭开。</p></div>' +
        '<div class="guess-empty-tiles" aria-hidden="true"><i></i><i></i><i></i></div></div>';
  }

  function updateStats() {
    const slot = document.getElementById('stats-slot');
    if (state.mode !== 'daily') {
      slot.innerHTML = '';
      return;
    }
    const st = state.stats;
    slot.innerHTML =
      '<section class="guess-footer" aria-label="本地战绩">' +
      '<div class="guess-stats-intro">' + icon('fingerprint', 21) +
      '<span>你的战绩<small>只记每日一题，保存在这台设备</small></span></div>' +
      '<dl class="guess-stats">' +
      '<div><dt>已玩</dt><dd>' + st.played + '<small>场</small></dd></div>' +
      '<div><dt>胜率</dt><dd>' + (st.played ? Math.round((st.won / st.played) * 100) : 0) + '<small>%</small></dd></div>' +
      '<div><dt>连胜</dt><dd>' + st.streak + '<small>场</small></dd></div>' +
      '<div><dt>最少步数</dt><dd>' + (st.best ?? '·') + '<small>次</small></dd></div>' +
      '</dl></section>';
  }

  function updateHero() {
    const art = document.getElementById('guess-art');
    if (!art || !state.session) return;
    const won = state.session.guesses.some((r) => r.won);
    art.classList.toggle('is-solved', won);
    const strong = art.querySelector('.sheet-front strong');
    if (strong) strong.innerHTML = won ? icon('check', 106, 1.5) : '?';
    const bottom = art.querySelector('.guess-card-bottom span');
    if (bottom) bottom.textContent = won ? '身份已揭晓' : '今日未知模型';
  }

  function updateError() {
    const slot = document.getElementById('error-slot');
    if (!slot) return;
    slot.innerHTML = state.error
      ? '<p class="guess-error" role="alert">' + esc(state.error) + '</p>'
      : '';
  }

  function focusInput() {
    const input = document.getElementById('guess-input');
    if (input) input.focus();
  }

  // ── 事件委托 ──
  root.addEventListener('click', (e) => {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;
    if (action === 'enter-daily') enterDaily(true);
    else if (action === 'enter-practice') enterPractice(Number(target.dataset.difficulty), true);
    else if (action === 'back-picker') backToPicker(true);
    else if (action === 'submit-active') {
      const cands = candidates();
      if (cands.length) submit(cands[Math.min(state.activeIndex, cands.length - 1)]);
    } else if (action === 'pick') {
      const m = modelById.get(target.dataset.id);
      if (m) submit(m);
    } else if (action === 'reveal') revealAnswer();
    else if (action === 'replay') replay();
    else if (action === 'play-again') playAgain();
    else if (action === 'brand') backToPicker();
  });
  // 点建议列表不抢输入框焦点（与 React 版 onMouseDown preventDefault 同效）
  root.addEventListener('mousedown', (e) => {
    if (e.target.closest('.guess-suggest')) e.preventDefault();
  });
  document.getElementById('brand').addEventListener('click', backToPicker);

  const revealPicker = () => document.body.classList.remove('gt-entering');
  renderPicker();
  document.body.classList.add('gt-entering');
  dealEntrance(revealPicker, revealPicker);
})();
</script>
</body>
</html>
