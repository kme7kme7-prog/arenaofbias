<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena 入口</title>
<link rel="stylesheet" href="transition.css">
<script src="transition.js" defer></script>
<style>
:root {
  --sans: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;
  --cond: "Bahnschrift", "DIN Alternate", "Arial Narrow", var(--sans);
  --ease: cubic-bezier(.2,.7,.2,1);
}
* { box-sizing: border-box; margin: 0; }
body { background: #121211; font: 15px/1.6 var(--sans); }
a { color: inherit; text-decoration: none; }

main { display: flex; min-height: 100vh; min-height: 100dvh; }
.half { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 clamp(28px, 5vw, 88px) clamp(56px, 11vh, 120px); overflow: hidden; transition: flex-grow .7s var(--ease); }
main:hover .half:hover { flex-grow: 1.18; }

.glyph { position: absolute; top: 50%; right: -0.08em; transform: translateY(-58%); font-size: clamp(260px, 38vw, 620px); line-height: 1; pointer-events: none; user-select: none; transition: transform .9s var(--ease), opacity .9s var(--ease); }
.half:hover .glyph { transform: translateY(-58%) translateX(-2%); }

.label { font: 12px var(--mono); letter-spacing: .14em; margin-bottom: 22px; }
h1 { font-size: clamp(44px, 5.6vw, 88px); line-height: 1.04; }
.en { margin-top: 14px; font: 12px var(--mono); letter-spacing: .32em; }
.line { margin-top: 28px; max-width: 22em; min-height: 3.2em; font-size: 16px; }
.line-more { opacity: .72; font-size: 14px; }
.go { display: inline-flex; align-items: center; gap: 14px; margin-top: 40px; width: min(100%, 240px); height: 52px; padding: 0 22px; font-size: 16px; font-weight: 600; align-self: flex-start; }
.go span { margin-left: auto; }
.go span { transition: transform .3s var(--ease); }
.go:hover span { transform: translateX(4px); }

/* 偏见试验场 */
.arena { background: #d9ddda; color: #1d2423; }
.arena .glyph { font-family: var(--sans); font-weight: 900; color: #1d2423; opacity: .055; }
.arena .label, .arena .en { color: #59635d; }
.arena h1 { font-family: var(--cond); font-weight: 700; letter-spacing: .01em; }
.arena .line { color: #3a4441; }
.arena .go { background: #1c2423; color: #d9fb51; box-shadow: 3px 4px 0 #94a073; transition: transform .25s, box-shadow .25s; }
.arena .go:hover { transform: translate(-1px, -3px); box-shadow: 5px 7px 0 #94a073; }
.arena .go:active { transform: translate(2px, 3px); box-shadow: 0 0 0 #94a073; }

/* 亿模亿样 */
.gallery { background: #121211; color: #ecebe6; }
.gallery .glyph { font-family: var(--serif); color: #ecebe6; opacity: .05; }
.gallery .label, .gallery .en { color: #8d8a82; }
.gallery h1 { font-family: var(--serif); font-weight: 500; }
.gallery .line { color: #bcb9b1; }
.gallery .go { background: #e46a50; color: #fff; border-radius: 6px; }

.top, .foot { position: fixed; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 clamp(28px, 5vw, 88px); pointer-events: none; z-index: 2; mix-blend-mode: difference; color: #fff; font: 11px var(--mono); letter-spacing: .14em; }
.top { top: 28px; } .foot { bottom: 24px; color: #8d8a82; mix-blend-mode: normal; }
.top a, .foot a { pointer-events: auto; }
.foot nav { display: flex; gap: 22px; }
.foot .l { color: #59635d; }
.foot a:hover { color: #ecebe6; }

@media (max-width: 760px) {
  main { flex-direction: column; }
  .half { min-height: 50vh; min-height: 50svh; padding: 88px 24px 44px; }
  main:hover .half:hover { flex-grow: 1; }
  .glyph { font-size: 62vw; }
  .label { margin-bottom: 14px; }
  .line { margin-top: 18px; min-height: 0; font-size: 15px; }
  .go { margin-top: 28px; }
  .top { top: 22px; padding: 0 24px; }
  .foot { position: static; background: #121211; padding: 18px 24px 26px; flex-direction: column; align-items: flex-start; gap: 10px; }
  .foot .l { color: #8d8a82; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top"><span>ArenaGallerI</span><span>同一道题 · 两种看法</span></header>

<main>
  <section class="half arena">
    <span class="glyph" aria-hidden="true">玩</span>
    <p class="label">01 — 玩法</p>
    <h1>偏见试验场</h1>
    <p class="en">ARENA OF BIAS</p>
    <p class="line">不看名字，凭直觉二选一。<br><span class="line-more">还有一些小游戏。</span></p>
    <a class="go" href="https://game.arenaofbias.icu/">来一局 <span>→</span></a>
  </section>

  <section class="half gallery">
    <span class="glyph" aria-hidden="true">观</span>
    <p class="label">02 — 馆藏</p>
    <h1>亿模亿样</h1>
    <p class="en">GALLERY</p>
    <p class="line">同一份提示词，各家模型的解答并排陈列。</p>
    <a class="go" href="https://gallery.arenaofbias.icu/">逛一圈 <span>→</span></a>
  </section>
</main>

<footer class="foot"><span class="l">站内作品均为 AI 生成</span><nav><a href="https://game.arenaofbias.icu/#terms">条款</a><a href="https://game.arenaofbias.icu/#privacy">隐私</a></nav></footer>
</body>
</html>
