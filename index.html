<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="/playground-entry-boot.js"></script>
    <script>
      if (new URLSearchParams(location.search).get('entry') === 'portal') document.documentElement.dataset.entry = 'game';
    </script>
    <style>html[data-entry]::after { content:''; position:fixed; inset:0; z-index:2147483646; background:#d9ddda; }</style>
    <script src="/entry-boot.js"></script>
    <!-- interactive-widget=resizes-content：Android Chrome 默认只缩视觉视口，键盘会
         盖住登录框的提交按钮且滚不到；让键盘压缩布局视口，dvh 才会跟着缩。
         viewport-fit=cover 让 env(safe-area-inset-*) 在刘海屏上取到非零值。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#dfe3dd" />
    <script id="theme-boot">
      (() => {
        let theme;
        try { theme = localStorage.getItem('aob-theme'); } catch {}
        if (theme === 'system') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : 'paper';
        if (theme !== 'paper' && theme !== 'ink') theme = 'paper';
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme === 'ink' ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'ink' ? '#121211' : '#dfe3dd');
      })();
    </script>
    <style id="theme-first-paint">html { background: #d9ddda; } html[data-theme="ink"] { background: #121211; }</style>
    <title>偏见试验场 ARENA OF BIAS — 相信你的第一直觉</title>
    <meta
      name="description"
      content="两份作品，一个选择。图像、文字与网页的匿名对决。"
    />
