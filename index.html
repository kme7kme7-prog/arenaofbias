    <!-- interactive-widget=resizes-content：Android Chrome 默认只缩视觉视口，键盘会

    <meta name="theme-color" content="#dfe3dd" />
    <script id="theme-boot">
      (() => {
        let theme;
        try { theme = localStorage.getItem('aob-theme'); } catch {}
        if (theme === 'system') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : 'paper';
        if (theme !== 'paper' && theme !== 'ink') theme = 'paper';
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme === 'ink' ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'ink' ? '#121211' : '#dfe3dd');
      })();
    </script>
    <style id="theme-first-paint">html { background: #d9ddda; } html[data-theme="ink"] { background: #121211; }</style>
